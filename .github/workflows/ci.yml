name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: indexly
          POSTGRES_PASSWORD: indexly
          POSTGRES_DB: indexly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U indexly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://indexly:indexly@127.0.0.1:5433/indexly
      AUTH_SECRET: ci-only-secret-ci-only-secret-32ch
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Check formatting
        run: npm run format:check
